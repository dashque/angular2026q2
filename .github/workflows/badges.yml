name: 'Создание бейджа покрытия'

on:
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Запуск тестов с покрытием
        run: pnpm test:cov

      - name: Генерация всех бейджей
        uses: jpb06/jest-badges-action@latest
        with:
          branches: dev
          output-folder: 'badges'

      - name: Коммит бейджей в репозиторий
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f coverage/badges.svg badges/
          git diff --staged --quiet || git commit -m "Обновление бейджа покрытия"
          git push
