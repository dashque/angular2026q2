<div class="mx-auto flex w-full max-w-250 flex-col gap-6 px-10">
  @if (film().value(); as filmInfo) {
    <div class="flex items-center gap-6">
      <img [alt]="filmInfo.title" [ngSrc]="filmInfo.posterUrl" width="300" height="200" />
      <div class="flex flex-col gap-2">
        <div class="text-3xl font-semibold">{{ filmInfo.title }}</div>
        <div class="text-text-secondary">{{ filmInfo.year }}</div>
        <div class="text-text-secondary">{{ filmInfo.genre }}</div>
        <div class="text-text-secondary">{{ filmInfo.rating }}</div>
        <div class="text-text-secondary">{{ filmInfo.duration | duration }}</div>
      </div>
    </div>
    <div class="flex items-center justify-between gap-4 rounded-md border border-border px-4 py-3 bg-bg-surface">
      <div class="text-center flex-1">{{ filmInfo.description }}</div>
      <button [dashqFavorite]="filmInfo" type="button">
        <span class="sr-only">Favorite</span>
      </button>
    </div>
    <div class="w-full flex justify-center">
      <a
        routerLink="/"
        class="mt-6 inline-flex items-center justify-center rounded-md border-2 border-border px-4 py-2 text-text-primary transition hover:bg-bg-primary"
      >
        Back to Home
      </a>
    </div>
  }
</div>
