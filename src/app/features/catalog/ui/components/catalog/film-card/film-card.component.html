@let filmInfo = film();
<div class="flex flex-col items-center">
  <img [alt]="filmInfo.title" [ngSrc]="filmInfo.posterUrl" width="200" height="100" />
  <div class="flex justify-around gap-2">
    <p>{{ filmInfo.title }}</p>
    <p>{{ filmInfo.year }}</p>
  </div>
</div>
<div class="flex justify-around gap-2">
  <p>{{ filmInfo.genre }}</p>
  <p>{{ filmInfo.rating }}</p>
  <button [dashqFavorite]="filmInfo" type="button">
    <span class="sr-only">Favorite</span>
  </button>
</div>
